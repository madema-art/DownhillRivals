name: Build, test & deploy to GitHub Pages
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Headless AI race simulation (sanity)
        run: npm run sim -- 4
      - name: Typecheck + production build
        run: npm run build
      - uses: actions/configure-pages@v5
        with: { enablement: true }
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser test against the LIVE deployed URL
        run: |
          curl -sSf -o /dev/null -w "live http %{http_code}\n" "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          GAME_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: live-shots, path: shots }
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-shots, path: shots }
